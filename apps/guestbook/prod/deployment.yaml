apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook
  labels: {app: guestbook, env: prod}
spec:
  replicas: 3
  selector:
    matchLabels: {app: guestbook}
  template:
    metadata:
      labels: {app: guestbook, env: prod}
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1   # promoted from pre-prod via a reviewed PR + human sync
          ports:
            - {name: http, containerPort: 9898}
          env:
            - {name: PODINFO_UI_COLOR,   value: "#4285F4"}   # blue = prod
            - {name: PODINFO_UI_MESSAGE, value: "PROD (deployed only after human sync)"}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits:   {cpu: 100m, memory: 64Mi}
