apiVersion: v1
kind: Service
metadata:
  name: guestbook
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-additional-resource-tags: 'auto-delete=never,auto-stop=no'
spec:
  type: LoadBalancer
  selector:
    app: guestbook
  ports:
    - port: 80
      targetPort: http
  loadBalancerSourceRanges:
    - 54.240.197.227/32